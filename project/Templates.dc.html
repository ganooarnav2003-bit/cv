<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>150 Resume Templates</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none}
:root,[data-app-root]{
  --bg:#EAF1FB;--surface:#FFFFFF;--surface-2:#FBFBFC;
  --border:#E4E7EC;--border-2:#EAECF0;--line:#D0D5DD;--line-soft:#EDEDED;
  --text:#101828;--text-muted:#475467;--text-faint-2:#98A2B3;
  --accent:#15803D;--accent-2:#22C55E;--accent-contrast:#FFFFFF;
  --chip-bg:#F2F4F7;--chip-bg-2:#EDF2FA;
}
[data-app-root="dark"]{
  --bg:#070D09;--surface:#0F1712;--surface-2:#111C15;
  --border:#1E2E22;--border-2:#1A2A1F;--line:#2A3D2F;--line-soft:#203027;
  --text:#4ADE80;--text-muted:#86EFAC;--text-faint-2:#56B37C;
  --accent:#22C55E;--accent-2:#4ADE80;--accent-contrast:#04130B;
  --chip-bg:#132019;--chip-bg-2:#13241A;
}
body{background:var(--bg);color:var(--text)}
.backlink{color:var(--text-muted);font-weight:500;font-size:14px}
.backlink:hover{color:var(--text)}
.pill{background:var(--surface);border:1px solid var(--line);color:var(--text-muted);font-weight:600;font-size:13px;padding:8px 16px;border-radius:7px}
.pill:hover{border-color:var(--accent);color:var(--text)}
.tcard{background:var(--surface);border:1px solid var(--border)}
.tcard:hover{border-color:var(--accent-2);box-shadow:0 12px 28px rgba(16,24,40,0.08)}
.tcard-thumb{background:var(--surface-2)}
.usebtn{opacity:0;transition:opacity .12s ease}
.tcard:hover .usebtn{opacity:1}
.theme-toggle{width:36px;height:36px;border-radius:8px;background:var(--chip-bg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
@media (max-width:700px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr)) !important}
}
</style>
</helmet>

<div data-app-root="{{theme}}" style="width:100%;max-width:100%;min-width:0;display:flex;flex-direction:column;align-items:center;box-sizing:border-box;background:var(--bg);color:var(--text)">

  <!-- HEADER -->
  <header style="width:100%;max-width:1280px;padding:28px 32px 0;box-sizing:border-box">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <a class="backlink" href="Main.dc.html">&larr; Back to home</a>
      <button class="theme-toggle" onClick="{{toggleTheme}}" aria-label="Toggle dark mode">
        <sc-if value="{{ isDark }}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="5" stroke="var(--accent-2)" stroke-width="1.8"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" stroke="var(--accent-2)" stroke-width="1.8" stroke-linecap="round"/></svg>
        </sc-if>
        <sc-if value="{{ isLight }}">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="var(--accent)"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
        </sc-if>
        <sc-if value="{{ isAuto }}">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke="var(--accent)" stroke-width="1.8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="var(--accent)"/></svg>
        </sc-if>
      </button>
    </div>
    <div style="display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-top:14px">
      <div>
        <h1 style="font-size:28px;font-weight:800;letter-spacing:-0.01em;margin:0 0 6px">Resume templates</h1>
        <p style="font-size:14.5px;color:var(--text-muted);margin:0">150 free templates &mdash; pick one and start filling it in</p>
      </div>
    </div>

    <!-- CATEGORY FILTER -->
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin:24px 0 8px">
      <sc-for list="{{categories}}" as="cat" hint-placeholder-count="6">
        <button class="pill" onClick="{{ cat.pick }}" style="{{ cat.style }}">{{ cat.label }}</button>
      </sc-for>
    </div>
  </header>

  <!-- GRID -->
  <section style="width:100%;max-width:1280px;padding:16px 32px 80px;box-sizing:border-box">
    <div class="grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px">
      <sc-for list="{{templates}}" as="item" hint-placeholder-count="30">
        <div class="tcard" onClick="{{ item.open }}" style="border-radius:12px;overflow:hidden;transition:all .12s ease;display:flex;flex-direction:column;min-width:0;cursor:pointer">

          <div class="tcard-thumb" style="height:150px;padding:16px;box-sizing:border-box;position:relative">

            <sc-if value="{{ item.isModern }}">
              <div style="position:absolute;top:0;right:0;width:70px;height:70px;background:{{item.accent}};border-radius:0 0 0 70px"></div>
              <div style="width:30px;height:30px;border-radius:50%;background:var(--surface);border:3px solid {{item.accent}};margin-bottom:10px"></div>
              <div style="height:9px;width:60%;background:var(--text);border-radius:2px;margin-bottom:6px"></div>
              <div style="height:5px;width:40%;background:var(--line);border-radius:2px;margin-bottom:14px"></div>
              <div style="height:5px;width:85%;background:var(--border-2);border-radius:2px;margin-bottom:5px"></div>
              <div style="height:5px;width:70%;background:var(--border-2);border-radius:2px"></div>
            </sc-if>

            <sc-if value="{{ item.isMinimal }}">
              <div style="height:2px;width:30%;background:{{item.accent}};margin-bottom:16px"></div>
              <div style="height:7px;width:50%;background:var(--text);border-radius:1px;margin-bottom:20px"></div>
              <div style="height:4px;width:75%;background:var(--line-soft);border-radius:1px;margin-bottom:8px"></div>
              <div style="height:4px;width:55%;background:var(--line-soft);border-radius:1px"></div>
            </sc-if>

            <sc-if value="{{ item.isCreative }}">
              <div style="position:absolute;top:-10px;left:-10px;width:56px;height:56px;background:{{item.accent}};border-radius:50%;opacity:0.85"></div>
              <div style="position:absolute;top:8px;left:26px;width:30px;height:30px;background:{{item.accent2}};border-radius:50%;opacity:0.9"></div>
              <div style="margin-top:48px">
                <div style="height:8px;width:65%;background:var(--text);border-radius:2px;margin-bottom:6px"></div>
                <div style="height:5px;width:45%;background:var(--line);border-radius:2px;margin-bottom:12px"></div>
                <div style="height:5px;width:88%;background:var(--border-2);border-radius:2px;margin-bottom:5px"></div>
                <div style="height:5px;width:70%;background:var(--border-2);border-radius:2px"></div>
              </div>
            </sc-if>

            <sc-if value="{{ item.isExecutive }}">
              <div style="text-align:center">
                <div style="height:9px;width:55%;background:var(--text);border-radius:2px;margin:0 auto 6px"></div>
                <div style="height:5px;width:35%;background:{{item.accent}};border-radius:2px;margin:0 auto 10px"></div>
                <div style="height:1px;width:70%;background:var(--line);margin:0 auto 10px"></div>
                <div style="height:5px;width:80%;background:var(--border-2);border-radius:2px;margin:0 auto 5px"></div>
                <div style="height:5px;width:60%;background:var(--border-2);border-radius:2px;margin:0 auto"></div>
              </div>
            </sc-if>

            <sc-if value="{{ item.isProfessional }}">
              <div style="display:flex;gap:10px;height:100%">
                <div style="width:30%;background:{{item.accent}};border-radius:4px;flex-shrink:0"></div>
                <div style="flex:1;min-width:0">
                  <div style="height:8px;width:80%;background:var(--text);border-radius:2px;margin-bottom:10px"></div>
                  <div style="height:5px;width:95%;background:var(--border-2);border-radius:2px;margin-bottom:5px"></div>
                  <div style="height:5px;width:88%;background:var(--border-2);border-radius:2px;margin-bottom:5px"></div>
                  <div style="height:5px;width:70%;background:var(--border-2);border-radius:2px;margin-bottom:5px"></div>
                  <div style="height:5px;width:80%;background:var(--border-2);border-radius:2px"></div>
                </div>
              </div>
            </sc-if>

            <button class="usebtn" onClick="{{ item.open }}" style="position:absolute;inset:0;margin:auto;width:110px;height:34px;background:#101828;color:#FFF;font-weight:700;font-size:13px;border-radius:7px;align-self:center">Preview</button>
          </div>

          <div style="padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px">
            <div style="min-width:0">
              <div style="font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{item.name}}</div>
              <div style="font-size:11.5px;color:var(--text-faint-2);font-weight:500">{{item.category}}</div>
            </div>
            <a href="Editor.dc.html" onClick="{{ stopClick }}" style="display:inline-block;background:var(--chip-bg-2);color:var(--accent);font-weight:700;font-size:12px;padding:7px 12px;border-radius:7px;flex-shrink:0">Use</a>
          </div>
        </div>
      </sc-for>
    </div>
  </section>

  <sc-if value="{{ showPreview }}">
    <div onClick="{{ closePreview }}" style="position:fixed;inset:0;background:rgba(16,24,40,0.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:24px;box-sizing:border-box">
      <div onClick="{{ stopClick }}" style="background:var(--surface);border-radius:16px;max-width:440px;width:100%;overflow:hidden;box-shadow:0 30px 70px rgba(16,24,40,0.35)">
        <div style="height:340px;background:var(--surface-2);padding:32px;box-sizing:border-box;position:relative">

          <sc-if value="{{ preview.isModern }}">
            <div style="position:absolute;top:0;right:0;width:130px;height:130px;background:{{preview.accent}};border-radius:0 0 0 130px"></div>
            <div style="width:56px;height:56px;border-radius:50%;background:var(--surface);border:4px solid {{preview.accent}};margin-bottom:16px"></div>
            <div style="height:14px;width:55%;background:var(--text);border-radius:3px;margin-bottom:8px"></div>
            <div style="height:8px;width:35%;background:var(--line);border-radius:3px;margin-bottom:22px"></div>
            <div style="height:7px;width:85%;background:var(--border-2);border-radius:3px;margin-bottom:8px"></div>
            <div style="height:7px;width:70%;background:var(--border-2);border-radius:3px;margin-bottom:8px"></div>
            <div style="height:7px;width:78%;background:var(--border-2);border-radius:3px"></div>
          </sc-if>

          <sc-if value="{{ preview.isMinimal }}">
            <div style="height:2px;width:22%;background:{{preview.accent}};margin-bottom:28px"></div>
            <div style="height:13px;width:45%;background:var(--text);border-radius:2px;margin-bottom:34px"></div>
            <div style="height:6px;width:70%;background:var(--line-soft);border-radius:2px;margin-bottom:12px"></div>
            <div style="height:6px;width:55%;background:var(--line-soft);border-radius:2px;margin-bottom:12px"></div>
            <div style="height:6px;width:60%;background:var(--line-soft);border-radius:2px"></div>
          </sc-if>

          <sc-if value="{{ preview.isCreative }}">
            <div style="position:absolute;top:-20px;left:-20px;width:110px;height:110px;background:{{preview.accent}};border-radius:50%;opacity:0.85"></div>
            <div style="position:absolute;top:20px;left:55px;width:60px;height:60px;background:{{preview.accent2}};border-radius:50%;opacity:0.9"></div>
            <div style="margin-top:90px">
              <div style="height:13px;width:60%;background:var(--text);border-radius:3px;margin-bottom:8px"></div>
              <div style="height:8px;width:40%;background:var(--line);border-radius:3px;margin-bottom:20px"></div>
              <div style="height:7px;width:88%;background:var(--border-2);border-radius:3px;margin-bottom:8px"></div>
              <div style="height:7px;width:72%;background:var(--border-2);border-radius:3px"></div>
            </div>
          </sc-if>

          <sc-if value="{{ preview.isExecutive }}">
            <div style="text-align:center;padding-top:10px">
              <div style="height:14px;width:50%;background:var(--text);border-radius:3px;margin:0 auto 8px"></div>
              <div style="height:8px;width:30%;background:{{preview.accent}};border-radius:3px;margin:0 auto 16px"></div>
              <div style="height:1px;width:60%;background:var(--line);margin:0 auto 16px"></div>
              <div style="height:7px;width:75%;background:var(--border-2);border-radius:3px;margin:0 auto 8px"></div>
              <div style="height:7px;width:55%;background:var(--border-2);border-radius:3px;margin:0 auto"></div>
            </div>
          </sc-if>

          <sc-if value="{{ preview.isProfessional }}">
            <div style="display:flex;gap:18px;height:100%">
              <div style="width:30%;background:{{preview.accent}};border-radius:6px;flex-shrink:0"></div>
              <div style="flex:1;min-width:0">
                <div style="height:12px;width:80%;background:var(--text);border-radius:3px;margin-bottom:16px"></div>
                <div style="height:7px;width:95%;background:var(--border-2);border-radius:3px;margin-bottom:8px"></div>
                <div style="height:7px;width:88%;background:var(--border-2);border-radius:3px;margin-bottom:8px"></div>
                <div style="height:7px;width:70%;background:var(--border-2);border-radius:3px;margin-bottom:8px"></div>
                <div style="height:7px;width:80%;background:var(--border-2);border-radius:3px"></div>
              </div>
            </div>
          </sc-if>

        </div>
        <div style="padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-top:1px solid var(--border)">
          <div style="min-width:0">
            <div style="font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{preview.name}}</div>
            <div style="font-size:12.5px;color:var(--text-faint-2);font-weight:500">{{preview.category}} template</div>
          </div>
          <div style="display:flex;gap:10px;flex-shrink:0">
            <button onClick="{{ closePreview }}" style="background:var(--chip-bg);color:var(--text-muted);font-weight:600;font-size:13px;padding:10px 16px;border-radius:8px">Close</button>
            <a href="Editor.dc.html" style="display:inline-block;background:var(--accent);color:var(--accent-contrast);font-weight:700;font-size:13px;padding:10px 18px;border-radius:8px">Use this template</a>
          </div>
        </div>
      </div>
    </div>
  </sc-if>

</div>
  <dc-import name="ChatBot" hint-size="58px,58px" theme="{{theme}}"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":7800}}'>
const NAME_POOL = [
  "Modern Minimal","Classic Professional","Creative Edge","Executive Suite","Clean Slate",
  "Bold Statement","Simple Focus","Fresh Start","Sharp Lines","Elegant Grid",
  "Timeline Pro","Corner Accent","Two Column","Sidebar Classic","Monochrome",
  "Color Block","Soft Serif","Structured","Open Layout","Compact Pro"
];
const ACCENTS = ["#15803D","#22C55E","#2F6F63","#6354A1","#A66A32","#8C5A5A","#1E3A5F","#0F4C5C","#4A2545","#7A2E2E","#2C3E50","#1A5276","#6B4226","#3B3B58","#5D4037","#264653","#8B4513","#3E4C59","#B45309","#4B5563","#0E7490","#7C3AED","#9F1239","#134E4A","#44403C"];
const CATEGORIES = ["All","Modern","Minimal","Creative","Executive","Professional"];

class Component extends DCLogic {
  constructor(props) {
    super(props);
    let mode = "light";
    try { mode = localStorage.getItem("draftora-theme") || "light"; } catch (e) {}
    let systemDark = false;
    try { systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches; } catch (e) {}
    this.state = { category: "All", previewId: null, mode: mode, systemDark: systemDark };
    try {
      const mq = window.matchMedia("(prefers-color-scheme: dark)");
      const onChange = (e) => this.setState({ systemDark: e.matches });
      if (mq.addEventListener) mq.addEventListener("change", onChange);
      else if (mq.addListener) mq.addListener(onChange);
    } catch (e) {}
  }

  cycleTheme() {
    const order = ["light", "dark", "auto"];
    const next = order[(order.indexOf(this.state.mode) + 1) % order.length];
    try { localStorage.setItem("draftora-theme", next); } catch (e) {}
    this.setState({ mode: next });
  }

  renderVals() {
    const selected = this.state.category ?? "All";

    const all = Array.from({ length: 150 }, (_, i) => {
      const cat = CATEGORIES[1 + (i % 5)];
      const base = NAME_POOL[i % NAME_POOL.length];
      const num = Math.floor(i / NAME_POOL.length) + 1;
      return {
        id: i,
        name: num > 1 ? `${base} ${num}` : base,
        category: cat,
        accent: ACCENTS[i % ACCENTS.length],
        accent2: ACCENTS[(i + 3) % ACCENTS.length],
        isModern: cat === "Modern",
        isMinimal: cat === "Minimal",
        isCreative: cat === "Creative",
        isExecutive: cat === "Executive",
        isProfessional: cat === "Professional",
        open: () => this.setState({ previewId: i })
      };
    });

    const templates = selected === "All" ? all : all.filter((t) => t.category === selected);

    const categories = CATEGORIES.map((name) => {
      const isSel = name === selected;
      return {
        label: name,
        style: isSel
          ? "background:var(--accent);color:var(--accent-contrast);border-color:var(--accent)"
          : "",
        pick: () => this.setState({ category: name })
      };
    });

    const previewItem = this.state.previewId != null ? all.find((t) => t.id === this.state.previewId) : null;
    const closePreview = () => this.setState({ previewId: null });
    const stopClick = (e) => { if (e && e.stopPropagation) e.stopPropagation(); };

    const mode = this.state.mode;
    const effective = mode === "auto" ? (this.state.systemDark ? "dark" : "light") : mode;
    return {
      theme: effective,
      isDark: mode === "dark",
      isLight: mode === "light",
      isAuto: mode === "auto",
      toggleTheme: () => this.cycleTheme(),
      templates,
      categories,
      showPreview: !!previewItem,
      preview: previewItem || { name: "", category: "", accent: "#15803D", accent2: "#22C55E", isModern: true, isMinimal: false, isCreative: false, isExecutive: false, isProfessional: false },
      closePreview,
      stopClick
    };
  }
}
</script>
</body>
</html>
