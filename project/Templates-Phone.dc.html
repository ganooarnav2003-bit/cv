<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Resume Templates (Phone)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none}
:root,[data-app-root]{
  --bg:#EAF1FB;--surface:#FFFFFF;--surface-2:#FBFBFC;
  --border:#E4E7EC;--border-2:#EAECF0;--line:#D0D5DD;
  --text:#101828;--text-muted:#475467;--text-faint-2:#98A2B3;
  --accent:#15803D;--accent-2:#22C55E;--accent-contrast:#FFFFFF;
  --chip-bg:#F2F4F7;--chip-bg-2:#EDF2FA;
}
[data-app-root="dark"]{
  --bg:#070D09;--surface:#0F1712;--surface-2:#111C15;
  --border:#1E2E22;--border-2:#1A2A1F;--line:#2A3D2F;
  --text:#34D399;--text-muted:#10B981;--text-faint-2:#047857;
  --accent:#22C55E;--accent-2:#4ADE80;--accent-contrast:#04130B;
  --chip-bg:#132019;--chip-bg-2:#13241A;
}
body{background:var(--bg);color:var(--text)}
.backlink{color:var(--text-muted);font-weight:500;font-size:13.5px}
.chiprow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.chiprow::-webkit-scrollbar{display:none}
.pill{background:var(--surface);border:1px solid var(--line);color:var(--text-muted);font-weight:600;font-size:12.5px;padding:7px 14px;border-radius:7px;white-space:nowrap;flex-shrink:0}
.tcard{background:var(--surface);border:1px solid var(--border)}
.tcard:active{border-color:var(--accent-2)}
.theme-toggle{width:36px;height:36px;border-radius:8px;background:var(--chip-bg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
</style>
</helmet>

<div data-app-root="{{theme}}" style="width:390px;min-width:0;display:flex;flex-direction:column;align-items:stretch;box-sizing:border-box;background:var(--bg);color:var(--text)">

  <header style="padding:20px 18px 0;box-sizing:border-box">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <a class="backlink" href="Main-Phone.dc.html">&larr; Home</a>
      <button class="theme-toggle" onClick="{{toggleTheme}}" aria-label="Toggle dark mode">
        <sc-if value="{{ isDark }}">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="5" stroke="var(--accent-2)" stroke-width="1.8"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" stroke="var(--accent-2)" stroke-width="1.8" stroke-linecap="round"/></svg>
        </sc-if>
        <sc-if value="{{ isLight }}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="var(--accent)"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
        </sc-if>
        <sc-if value="{{ isAuto }}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke="var(--accent)" stroke-width="1.8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="var(--accent)"/></svg>
        </sc-if>
      </button>
    </div>
    <h1 style="font-size:22px;font-weight:800;letter-spacing:-0.01em;margin:12px 0 4px">Resume templates</h1>
    <p style="font-size:13px;color:var(--text-muted);margin:0 0 16px">150 free templates</p>
    <div class="chiprow">
      <sc-for list="{{categories}}" as="cat" hint-placeholder-count="6">
        <button class="pill" onClick="{{ cat.pick }}" style="{{ cat.style }}">{{ cat.label }}</button>
      </sc-for>
    </div>
  </header>

  <section style="padding:16px 18px 40px;box-sizing:border-box">
    <div style="display:flex;flex-direction:column;gap:14px">
      <sc-for list="{{templates}}" as="item" hint-placeholder-count="12">
        <div class="tcard" onClick="{{ item.open }}" style="border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0">
          <div style="height:130px;background:var(--surface-2);padding:16px;box-sizing:border-box;position:relative">
            <sc-if value="{{ item.v0 }}">
              <div style="height:10px;width:55%;border-radius:2px;margin-bottom:6px;background:{{item.accent}}"></div>
              <div style="height:6px;width:35%;background:var(--line);border-radius:2px;margin-bottom:10px"></div>
              <div style="height:5px;width:92%;background:var(--border-2);border-radius:2px;margin-bottom:5px"></div>
              <div style="height:5px;width:80%;background:var(--border-2);border-radius:2px;margin-bottom:5px"></div>
              <div style="height:5px;width:88%;background:var(--border-2);border-radius:2px"></div>
            </sc-if>
            <sc-if value="{{ item.v1 }}">
              <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
                <div style="width:28px;height:28px;border-radius:50%;background:{{item.accent}};flex-shrink:0"></div>
                <div style="min-width:0">
                  <div style="height:8px;width:70px;background:var(--text);border-radius:2px;margin-bottom:5px"></div>
                  <div style="height:5px;width:50px;background:var(--line);border-radius:2px"></div>
                </div>
              </div>
              <div style="height:5px;width:95%;background:var(--border-2);border-radius:2px;margin-bottom:5px"></div>
              <div style="height:5px;width:75%;background:var(--border-2);border-radius:2px"></div>
            </sc-if>
            <sc-if value="{{ item.v2 }}">
              <div style="display:flex;gap:10px;height:100%">
                <div style="width:30%;background:{{item.accent}};border-radius:4px;flex-shrink:0"></div>
                <div style="flex:1;min-width:0">
                  <div style="height:8px;width:80%;background:var(--text);border-radius:2px;margin-bottom:8px"></div>
                  <div style="height:5px;width:95%;background:var(--border-2);border-radius:2px;margin-bottom:5px"></div>
                  <div style="height:5px;width:70%;background:var(--border-2);border-radius:2px"></div>
                </div>
              </div>
            </sc-if>
          </div>
          <div style="padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px">
            <div style="min-width:0">
              <div style="font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{item.name}}</div>
              <div style="font-size:11px;color:var(--text-faint-2);font-weight:500">{{item.category}}</div>
            </div>
            <button style="background:var(--chip-bg-2);color:var(--accent);font-weight:700;font-size:11.5px;padding:6px 11px;border-radius:7px;flex-shrink:0">Use</button>
          </div>
        </div>
      </sc-for>
    </div>
    <div style="text-align:center;margin-top:22px;font-size:12.5px;color:var(--text-faint-2)">+126 more templates, same pattern &mdash; scroll &amp; filter live on the full gallery</div>
  </section>

  <sc-if value="{{ showPreview }}">
    <div onClick="{{ closePreview }}" style="position:fixed;inset:0;background:rgba(16,24,40,0.55);display:flex;align-items:flex-end;z-index:50;box-sizing:border-box">
      <div onClick="{{ stopClick }}" style="background:var(--surface);border-radius:18px 18px 0 0;width:100%;overflow:hidden;box-shadow:0 -10px 40px rgba(16,24,40,0.3)">
        <div style="height:220px;background:var(--surface-2);padding:22px;box-sizing:border-box;position:relative">
          <sc-if value="{{ preview.v0 }}">
            <div style="height:14px;width:55%;border-radius:3px;margin-bottom:8px;background:{{preview.accent}}"></div>
            <div style="height:8px;width:35%;background:var(--line);border-radius:3px;margin-bottom:16px"></div>
            <div style="height:6px;width:92%;background:var(--border-2);border-radius:3px;margin-bottom:6px"></div>
            <div style="height:6px;width:80%;background:var(--border-2);border-radius:3px"></div>
          </sc-if>
          <sc-if value="{{ preview.v1 }}">
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
              <div style="width:44px;height:44px;border-radius:50%;background:{{preview.accent}};flex-shrink:0"></div>
              <div style="height:10px;width:120px;background:var(--text);border-radius:3px"></div>
            </div>
            <div style="height:6px;width:90%;background:var(--border-2);border-radius:3px"></div>
          </sc-if>
          <sc-if value="{{ preview.v2 }}">
            <div style="display:flex;gap:14px;height:100%">
              <div style="width:30%;background:{{preview.accent}};border-radius:6px;flex-shrink:0"></div>
              <div style="flex:1;min-width:0">
                <div style="height:10px;width:80%;background:var(--text);border-radius:3px;margin-bottom:10px"></div>
                <div style="height:6px;width:90%;background:var(--border-2);border-radius:3px"></div>
              </div>
            </div>
          </sc-if>
        </div>
        <div style="padding:18px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--border)">
          <div>
            <div style="font-weight:700;font-size:15px">{{preview.name}}</div>
            <div style="font-size:12px;color:var(--text-faint-2);font-weight:500">{{preview.category}} template</div>
          </div>
          <div style="display:flex;gap:10px">
            <button onClick="{{ closePreview }}" style="flex:1;background:var(--chip-bg);color:var(--text-muted);font-weight:600;font-size:13px;padding:11px;border-radius:8px">Close</button>
            <button style="flex:1;background:var(--accent);color:var(--accent-contrast);font-weight:700;font-size:13px;padding:11px;border-radius:8px">Use template</button>
          </div>
        </div>
      </div>
    </div>
  </sc-if>

</div>
<dc-import name="ChatBot" hint-size="58px,58px" theme="{{theme}}"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":5700}}'>
const NAME_POOL = [
  "Modern Minimal","Classic Professional","Creative Edge","Executive Suite","Clean Slate",
  "Bold Statement","Simple Focus","Fresh Start","Sharp Lines","Elegant Grid"
];
const ACCENTS = ["#15803D","#22C55E","#2F6F63","#6354A1","#A66A32","#8C5A5A"];
const CATEGORIES = ["All","Modern","Minimal","Creative","Executive","Professional"];

class Component extends DCLogic {
  constructor(props) {
    super(props);
    let mode = "light";
    try { mode = localStorage.getItem("draftora-theme") || "light"; } catch (e) {}
    let systemDark = false;
    try { systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches; } catch (e) {}
    this.state = { category: "All", previewId: null, mode: mode, systemDark: systemDark };
    try {
      const mq = window.matchMedia("(prefers-color-scheme: dark)");
      const onChange = (e) => this.setState({ systemDark: e.matches });
      if (mq.addEventListener) mq.addEventListener("change", onChange);
      else if (mq.addListener) mq.addListener(onChange);
    } catch (e) {}
  }

  cycleTheme() {
    const order = ["light", "dark", "auto"];
    const next = order[(order.indexOf(this.state.mode) + 1) % order.length];
    try { localStorage.setItem("draftora-theme", next); } catch (e) {}
    this.setState({ mode: next });
  }

  renderVals() {
    const selected = this.state.category ?? "All";

    const all = Array.from({ length: 24 }, (_, i) => {
      const cat = CATEGORIES[1 + (i % 5)];
      const base = NAME_POOL[i % NAME_POOL.length];
      const num = Math.floor(i / NAME_POOL.length) + 1;
      const variant = i % 3;
      return {
        id: i,
        name: num > 1 ? `${base} ${num}` : base,
        category: cat,
        accent: ACCENTS[i % ACCENTS.length],
        v0: variant === 0,
        v1: variant === 1,
        v2: variant === 2,
        open: () => this.setState({ previewId: i })
      };
    });

    const templates = selected === "All" ? all : all.filter((t) => t.category === selected);

    const categories = CATEGORIES.map((name) => ({
      label: name,
      style: name === selected ? "background:var(--accent);color:var(--accent-contrast);border-color:var(--accent)" : "",
      pick: () => this.setState({ category: name })
    }));

    const previewItem = this.state.previewId != null ? all.find((t) => t.id === this.state.previewId) : null;

    const mode = this.state.mode;
    const effective = mode === "auto" ? (this.state.systemDark ? "dark" : "light") : mode;
    return {
      theme: effective,
      isDark: mode === "dark",
      isLight: mode === "light",
      isAuto: mode === "auto",
      toggleTheme: () => this.cycleTheme(),
      templates,
      categories,
      showPreview: !!previewItem,
      preview: previewItem || { name: "", category: "", accent: "#15803D", v0: true, v1: false, v2: false },
      closePreview: () => this.setState({ previewId: null }),
      stopClick: (e) => { if (e && e.stopPropagation) e.stopPropagation(); }
    };
  }
}
</script>
</body>
</html>
