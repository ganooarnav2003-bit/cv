<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Resume Templates (Phone)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:#F0E6D3;color:#101828;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none}
.backlink{color:#475467;font-weight:500;font-size:13.5px}
.chiprow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.chiprow::-webkit-scrollbar{display:none}
.pill{background:#FFF;border:1px solid #D0D5DD;color:#475467;font-weight:600;font-size:12.5px;padding:7px 14px;border-radius:7px;white-space:nowrap;flex-shrink:0}
.tcard:active{border-color:#D0D5DD}
</style>
</helmet>

<div style="width:390px;min-width:0;display:flex;flex-direction:column;align-items:stretch;box-sizing:border-box">

  <header style="padding:20px 18px 0;box-sizing:border-box">
    <a class="backlink" href="Main-Phone.dc.html">&larr; Home</a>
    <h1 style="font-size:22px;font-weight:800;letter-spacing:-0.01em;margin:12px 0 4px">Resume templates</h1>
    <p style="font-size:13px;color:#475467;margin:0 0 16px">150 free templates</p>
    <div class="chiprow">
      <sc-for list="{{categories}}" as="cat" hint-placeholder-count="6">
        <button class="pill" onClick="{{ cat.pick }}" style="{{ cat.style }}">{{ cat.label }}</button>
      </sc-for>
    </div>
  </header>

  <section style="padding:16px 18px 40px;box-sizing:border-box">
    <div style="display:flex;flex-direction:column;gap:14px">
      <sc-for list="{{templates}}" as="item" hint-placeholder-count="12">
        <div class="tcard" onClick="{{ item.open }}" style="background:#FFF;border:1px solid #E4E7EC;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0">
          <div style="height:130px;background:#FBFBFC;padding:16px;box-sizing:border-box;position:relative">
            <sc-if value="{{ item.v0 }}">
              <div style="height:10px;width:55%;border-radius:2px;margin-bottom:6px;background:{{item.accent}}"></div>
              <div style="height:6px;width:35%;background:#D0D5DD;border-radius:2px;margin-bottom:10px"></div>
              <div style="height:5px;width:92%;background:#EAECF0;border-radius:2px;margin-bottom:5px"></div>
              <div style="height:5px;width:80%;background:#EAECF0;border-radius:2px;margin-bottom:5px"></div>
              <div style="height:5px;width:88%;background:#EAECF0;border-radius:2px"></div>
            </sc-if>
            <sc-if value="{{ item.v1 }}">
              <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
                <div style="width:28px;height:28px;border-radius:50%;background:{{item.accent}};flex-shrink:0"></div>
                <div style="min-width:0">
                  <div style="height:8px;width:70px;background:#101828;border-radius:2px;margin-bottom:5px"></div>
                  <div style="height:5px;width:50px;background:#D0D5DD;border-radius:2px"></div>
                </div>
              </div>
              <div style="height:5px;width:95%;background:#EAECF0;border-radius:2px;margin-bottom:5px"></div>
              <div style="height:5px;width:75%;background:#EAECF0;border-radius:2px"></div>
            </sc-if>
            <sc-if value="{{ item.v2 }}">
              <div style="display:flex;gap:10px;height:100%">
                <div style="width:30%;background:{{item.accent}};border-radius:4px;flex-shrink:0"></div>
                <div style="flex:1;min-width:0">
                  <div style="height:8px;width:80%;background:#101828;border-radius:2px;margin-bottom:8px"></div>
                  <div style="height:5px;width:95%;background:#EAECF0;border-radius:2px;margin-bottom:5px"></div>
                  <div style="height:5px;width:70%;background:#EAECF0;border-radius:2px"></div>
                </div>
              </div>
            </sc-if>
          </div>
          <div style="padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px">
            <div style="min-width:0">
              <div style="font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{item.name}}</div>
              <div style="font-size:11px;color:#98A2B3;font-weight:500">{{item.category}}</div>
            </div>
            <button style="background:#EDF2FA;color:#1D3557;font-weight:700;font-size:11.5px;padding:6px 11px;border-radius:7px;flex-shrink:0">Use</button>
          </div>
        </div>
      </sc-for>
    </div>
    <div style="text-align:center;margin-top:22px;font-size:12.5px;color:#98A2B3">+126 more templates, same pattern &mdash; scroll &amp; filter live on the full gallery</div>
  </section>

  <sc-if value="{{ showPreview }}">
    <div onClick="{{ closePreview }}" style="position:fixed;inset:0;background:rgba(16,24,40,0.55);display:flex;align-items:flex-end;z-index:50;box-sizing:border-box">
      <div onClick="{{ stopClick }}" style="background:#FFF;border-radius:18px 18px 0 0;width:100%;overflow:hidden;box-shadow:0 -10px 40px rgba(16,24,40,0.3)">
        <div style="height:220px;background:#FBFBFC;padding:22px;box-sizing:border-box;position:relative">
          <sc-if value="{{ preview.v0 }}">
            <div style="height:14px;width:55%;border-radius:3px;margin-bottom:8px;background:{{preview.accent}}"></div>
            <div style="height:8px;width:35%;background:#D0D5DD;border-radius:3px;margin-bottom:16px"></div>
            <div style="height:6px;width:92%;background:#EAECF0;border-radius:3px;margin-bottom:6px"></div>
            <div style="height:6px;width:80%;background:#EAECF0;border-radius:3px"></div>
          </sc-if>
          <sc-if value="{{ preview.v1 }}">
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
              <div style="width:44px;height:44px;border-radius:50%;background:{{preview.accent}};flex-shrink:0"></div>
              <div style="height:10px;width:120px;background:#101828;border-radius:3px"></div>
            </div>
            <div style="height:6px;width:90%;background:#EAECF0;border-radius:3px"></div>
          </sc-if>
          <sc-if value="{{ preview.v2 }}">
            <div style="display:flex;gap:14px;height:100%">
              <div style="width:30%;background:{{preview.accent}};border-radius:6px;flex-shrink:0"></div>
              <div style="flex:1;min-width:0">
                <div style="height:10px;width:80%;background:#101828;border-radius:3px;margin-bottom:10px"></div>
                <div style="height:6px;width:90%;background:#EAECF0;border-radius:3px"></div>
              </div>
            </div>
          </sc-if>
        </div>
        <div style="padding:18px;display:flex;flex-direction:column;gap:12px;border-top:1px solid #E4E7EC">
          <div>
            <div style="font-weight:700;font-size:15px">{{preview.name}}</div>
            <div style="font-size:12px;color:#98A2B3;font-weight:500">{{preview.category}} template</div>
          </div>
          <div style="display:flex;gap:10px">
            <button onClick="{{ closePreview }}" style="flex:1;background:#F2F4F7;color:#475467;font-weight:600;font-size:13px;padding:11px;border-radius:8px">Close</button>
            <button style="flex:1;background:#1D3557;color:#FFF;font-weight:700;font-size:13px;padding:11px;border-radius:8px">Use template</button>
          </div>
        </div>
      </div>
    </div>
  </sc-if>

</div>
<dc-import name="ChatBot" hint-size="58px,58px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":5700}}'>
const NAME_POOL = [
  "Modern Minimal","Classic Professional","Creative Edge","Executive Suite","Clean Slate",
  "Bold Statement","Simple Focus","Fresh Start","Sharp Lines","Elegant Grid"
];
const ACCENTS = ["#1D3557","#3B5A82","#2F6F63","#6354A1","#A66A32","#8C5A5A"];
const CATEGORIES = ["All","Modern","Minimal","Creative","Executive","Professional"];

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { category: "All", previewId: null };
  }

  renderVals() {
    const selected = this.state.category ?? "All";

    const all = Array.from({ length: 24 }, (_, i) => {
      const cat = CATEGORIES[1 + (i % 5)];
      const base = NAME_POOL[i % NAME_POOL.length];
      const num = Math.floor(i / NAME_POOL.length) + 1;
      const variant = i % 3;
      return {
        id: i,
        name: num > 1 ? `${base} ${num}` : base,
        category: cat,
        accent: ACCENTS[i % ACCENTS.length],
        v0: variant === 0,
        v1: variant === 1,
        v2: variant === 2,
        open: () => this.setState({ previewId: i })
      };
    });

    const templates = selected === "All" ? all : all.filter((t) => t.category === selected);

    const categories = CATEGORIES.map((name) => ({
      label: name,
      style: name === selected ? "background:#1D3557;color:#FFF;border-color:#1D3557" : "",
      pick: () => this.setState({ category: name })
    }));

    const previewItem = this.state.previewId != null ? all.find((t) => t.id === this.state.previewId) : null;

    return {
      templates,
      categories,
      showPreview: !!previewItem,
      preview: previewItem || { name: "", category: "", accent: "#1D3557", v0: true, v1: false, v2: false },
      closePreview: () => this.setState({ previewId: null }),
      stopClick: (e) => { if (e && e.stopPropagation) e.stopPropagation(); }
    };
  }
}
</script>
</body>
</html>
