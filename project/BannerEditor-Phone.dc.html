<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Banner Editor (Phone)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none}
:root,[data-app-root]{
  --bg:#EAF1FB;--surface:#FFFFFF;
  --border:#E4E7EC;--line:#D0D5DD;
  --text:#101828;--text-muted:#475467;--text-faint-2:#98A2B3;--label:#344054;
  --accent:#15803D;--accent-2:#22C55E;--accent-contrast:#FFFFFF;
  --chip-bg-2:#EDF2FA;--dash:#AFC6E0;
}
[data-app-root="dark"]{
  --bg:#070D09;--surface:#0F1712;
  --border:#1E2E22;--line:#2A3D2F;
  --text:#34D399;--text-muted:#10B981;--text-faint-2:#047857;--label:#34D399;
  --accent:#22C55E;--accent-2:#4ADE80;--accent-contrast:#04130B;
  --chip-bg-2:#13241A;--dash:#2F6B47;
}
body{background:var(--bg);color:var(--text)}
.backlink{color:var(--text-muted);font-weight:500;font-size:13.5px}
label{display:block;font-size:12px;font-weight:600;color:var(--label);margin-bottom:6px}
input{width:100%;box-sizing:border-box;font-family:'Inter',sans-serif;font-size:14px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;outline:none}
.field{margin-bottom:14px}
.gradswatch{width:100%;height:32px;border-radius:7px;cursor:pointer}
.vbtn{background:var(--surface);border:1px solid var(--line);color:var(--text-muted);font-weight:600;font-size:12px;padding:8px 10px;border-radius:7px;flex:1}
.filebtn{display:block;background:var(--chip-bg-2);color:var(--accent);font-weight:600;font-size:12.5px;padding:10px 14px;border-radius:8px;text-align:center;border:1px dashed var(--dash)}
.filebtn input{display:none}
.thumbwrap{position:relative;margin-top:10px;border-radius:8px;overflow:hidden;border:1px solid var(--border)}
.thumbwrap img{width:100%;height:76px;object-fit:cover;display:block}
.rmimg{position:absolute;top:6px;right:6px;background:rgba(16,24,40,0.75);color:#FFF;font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px}
.card{background:var(--surface);border:1px solid var(--border)}
.theme-toggle{width:36px;height:36px;border-radius:8px;background:var(--chip-bg-2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
</style>
</helmet>

<div data-app-root="{{theme}}" style="width:390px;min-width:0;display:flex;flex-direction:column;align-items:stretch;box-sizing:border-box;background:var(--bg);color:var(--text)">

  <header style="padding:18px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:10px">
    <a class="backlink" href="Banners-Phone.dc.html">&larr; Templates</a>
    <div style="display:flex;align-items:center;gap:10px">
      <button class="theme-toggle" onClick="{{toggleTheme}}" aria-label="Toggle dark mode">
        <sc-if value="{{ isDark }}">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="5" stroke="var(--accent-2)" stroke-width="1.8"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" stroke="var(--accent-2)" stroke-width="1.8" stroke-linecap="round"/></svg>
        </sc-if>
        <sc-if value="{{ isLight }}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="var(--accent)"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
        </sc-if>
        <sc-if value="{{ isAuto }}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke="var(--accent)" stroke-width="1.8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="var(--accent)"/></svg>
        </sc-if>
      </button>
      <button style="background:var(--accent);color:var(--accent-contrast);font-weight:700;font-size:12.5px;padding:9px 14px;border-radius:8px">Download</button>
    </div>
  </header>

  <!-- LIVE PREVIEW -->
  <section style="padding:0 18px 18px;box-sizing:border-box">
    <div style="width:100%;aspect-ratio:1.9/1;border-radius:12px;box-shadow:0 10px 26px rgba(16,24,40,0.1);background:linear-gradient(135deg,{{c1}} 0%,{{c2}} 100%);padding:20px;box-sizing:border-box;position:relative;display:flex;overflow:hidden">
      <sc-if value="{{ hasImage }}">
        <img src="{{image}}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
        <div style="position:absolute;inset:0;background:linear-gradient(135deg,rgba(16,24,40,0.55) 0%,rgba(16,24,40,0.25) 100%)"></div>
      </sc-if>
      <sc-if value="{{ v0 }}">
        <div style="margin:auto;text-align:center;position:relative;z-index:1">
          <div style="color:#FFF;font-weight:800;font-size:clamp(16px,6vw,26px);text-shadow:0 2px 6px rgba(0,0,0,0.3)">{{headline}}</div>
          <div style="margin-top:8px;display:inline-block;background:rgba(255,255,255,0.22);color:#FFF;font-size:11px;font-weight:700;padding:4px 11px;border-radius:7px">{{tag}}</div>
        </div>
      </sc-if>
      <sc-if value="{{ v1 }}">
        <div style="align-self:flex-start;position:relative;z-index:1">
          <div style="color:#FFF;font-weight:800;font-size:clamp(14px,5vw,22px);max-width:75%;text-shadow:0 2px 6px rgba(0,0,0,0.3)">{{headline}}</div>
        </div>
      </sc-if>
      <sc-if value="{{ v2 }}">
        <div style="position:absolute;top:14px;left:14px;background:rgba(255,255,255,0.92);color:#101828;font-size:10px;font-weight:800;padding:4px 10px;border-radius:7px;text-transform:uppercase;z-index:1">{{tag}}</div>
        <div style="align-self:flex-end;color:#FFF;font-weight:800;font-size:clamp(16px,6vw,24px);text-shadow:0 2px 6px rgba(0,0,0,0.3);position:relative;z-index:1">{{headline}}</div>
      </sc-if>
    </div>
    <div style="margin-top:10px;font-size:11.5px;color:var(--text-faint-2);text-align:center">1200 &times; 630 &middot; social post size</div>
  </section>

  <!-- CONTROLS -->
  <section style="padding:0 18px 36px;box-sizing:border-box">
    <div class="card" style="border-radius:12px;padding:18px;box-sizing:border-box">
      <h2 style="font-size:15px;font-weight:700;margin:0 0 12px">Content</h2>
      <div class="field"><label>Headline</label><input type="text" value="{{headline}}" onChange="{{ onHeadline }}"></div>
      <div class="field" style="margin-bottom:0"><label>Badge text</label><input type="text" value="{{tag}}" onChange="{{ onTag }}"></div>

      <div style="height:1px;background:var(--border);margin:16px 0"></div>
      <h2 style="font-size:15px;font-weight:700;margin:0 0 12px">Image</h2>
      <sc-if value="{{ !hasImage }}">
        <label class="filebtn">+ Add a photo<input type="file" accept="image/*" onChange="{{ onImage }}"></label>
      </sc-if>
      <sc-if value="{{ hasImage }}">
        <div class="thumbwrap"><img src="{{image}}" alt="Uploaded"><button class="rmimg" onClick="{{ removeImage }}">Remove</button></div>
      </sc-if>

      <div style="height:1px;background:var(--border);margin:16px 0"></div>
      <h2 style="font-size:15px;font-weight:700;margin:0 0 12px">Style</h2>
      <label>Color theme</label>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:14px">
        <sc-for list="{{swatches}}" as="sw" hint-placeholder-count="6">
          <div class="gradswatch" onClick="{{ sw.pick }}" style="background:linear-gradient(135deg,{{sw.c1}},{{sw.c2}});{{sw.ring}}"></div>
        </sc-for>
      </div>
      <label>Layout</label>
      <div style="display:flex;gap:7px">
        <sc-for list="{{layouts}}" as="lo" hint-placeholder-count="3">
          <button class="vbtn" onClick="{{ lo.pick }}" style="{{ lo.style }}">{{ lo.label }}</button>
        </sc-for>
      </div>
    </div>
  </section>

</div>
<dc-import name="ChatBot" hint-size="58px,58px" theme="{{theme}}"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":920}}'>
const COLOR_PAIRS = [
  ["#15803D","#22C55E"],
  ["#1F4E4A","#2F6F63"],
  ["#4A3F6B","#6354A1"],
  ["#7A4B1F","#A66A32"],
  ["#5B3A3A","#8C5A5A"],
  ["#30475E","#5583A3"]
];
const LAYOUTS = [
  { key: "v0", label: "Centered" },
  { key: "v1", label: "Left text" },
  { key: "v2", label: "Top badge" }
];

class Component extends DCLogic {
  constructor(props) {
    super(props);
    let mode = "light";
    try { mode = localStorage.getItem("draftora-theme") || "light"; } catch (e) {}
    let systemDark = false;
    try { systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches; } catch (e) {}
    this.state = { mode: mode, systemDark: systemDark, headline: "Your Brand Here", tag: "NEW", pairIndex: 0, layout: "v0", image: null };
    try {
      const mq = window.matchMedia("(prefers-color-scheme: dark)");
      const onChange = (e) => this.setState({ systemDark: e.matches });
      if (mq.addEventListener) mq.addEventListener("change", onChange);
      else if (mq.addListener) mq.addListener(onChange);
    } catch (e) {}
  }

  cycleTheme() {
    const order = ["light", "dark", "auto"];
    const next = order[(order.indexOf(this.state.mode) + 1) % order.length];
    try { localStorage.setItem("draftora-theme", next); } catch (e) {}
    this.setState({ mode: next });
  }

  renderVals() {
    const pair = COLOR_PAIRS[this.state.pairIndex];

    const swatches = COLOR_PAIRS.map((p, idx) => ({
      c1: p[0],
      c2: p[1],
      ring: idx === this.state.pairIndex ? `outline:2px solid ${p[0]};outline-offset:2px` : "",
      pick: () => this.setState({ pairIndex: idx })
    }));

    const layouts = LAYOUTS.map((l) => ({
      label: l.label,
      style: this.state.layout === l.key ? "background:var(--accent);color:var(--accent-contrast);border-color:var(--accent)" : "",
      pick: () => this.setState({ layout: l.key })
    }));

    const mode = this.state.mode;
    const effective = mode === "auto" ? (this.state.systemDark ? "dark" : "light") : mode;
    return {
      theme: effective,
      isDark: mode === "dark",
      isLight: mode === "light",
      isAuto: mode === "auto",
      toggleTheme: () => this.cycleTheme(),
      headline: this.state.headline,
      tag: this.state.tag,
      c1: pair[0],
      c2: pair[1],
      swatches,
      layouts,
      v0: this.state.layout === "v0",
      v1: this.state.layout === "v1",
      v2: this.state.layout === "v2",
      image: this.state.image,
      hasImage: !!this.state.image,
      onHeadline: (e) => this.setState({ headline: e.target.value }),
      onTag: (e) => this.setState({ tag: e.target.value }),
      onImage: (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => this.setState({ image: reader.result });
        reader.readAsDataURL(file);
      },
      removeImage: () => this.setState({ image: null })
    };
  }
}
</script>
</body>
</html>
