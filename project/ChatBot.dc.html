<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
.cbw-root *{box-sizing:border-box;font-family:'Inter',system-ui,sans-serif}
.cbw-root{
  --bg:#EAF1FB;--surface:#FFFFFF;--surface-2:#FBFBFC;
  --border:#E4E7EC;--text:#101828;
  --accent:#15803D;--accent-2:#22C55E;--accent-contrast:#FFFFFF;
  --chip-bg:#EDF2FA;--chip-hover:#DCE7F7;
}
.cbw-root[data-app-root="dark"]{
  --bg:#0B1710;--surface:#0F1712;--surface-2:#111C15;
  --border:#1E2E22;--text:#34D399;
  --accent:#22C55E;--accent-2:#4ADE80;--accent-contrast:#04130B;
  --chip-bg:#132019;--chip-hover:#17261D;
}
.cbw-fab{position:fixed;bottom:24px;right:24px;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#064E2E 0%,#22C55E 100%);box-shadow:0 10px 28px rgba(16,24,40,0.28);display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;z-index:2147483000;transition:transform .12s ease}
.cbw-fab:hover{transform:translateY(-2px)}
.cbw-root[data-app-root="dark"] .cbw-fab{overflow:hidden;background:radial-gradient(circle at 28% 22%,rgba(255,255,255,0.65) 0%,rgba(255,255,255,0) 45%),linear-gradient(135deg,#22C55E 0%,#3B82F6 100%);box-shadow:0 10px 28px rgba(34,160,230,0.45),inset 0 1px 2px rgba(255,255,255,0.5)}
.cbw-root[data-app-root="dark"] .cbw-fab::after{content:"";position:absolute;top:-60%;left:-20%;width:60%;height:220%;background:linear-gradient(115deg,rgba(255,255,255,0.55) 0%,rgba(255,255,255,0) 60%);transform:rotate(20deg);pointer-events:none}
.cbw-panel{position:fixed;bottom:24px;right:24px;width:348px;max-width:calc(100vw - 32px);height:500px;max-height:calc(100vh - 48px);background:var(--surface);border-radius:16px;box-shadow:0 24px 60px rgba(16,24,40,0.3);display:flex;flex-direction:column;overflow:hidden;z-index:2147483000;border:1px solid var(--border);animation:cbwPanelIn .16s ease}
.cbw-head{background:linear-gradient(135deg,#064E2E 0%,#22C55E 100%);padding:14px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.cbw-root[data-app-root="dark"] .cbw-head{position:relative;overflow:hidden;background:radial-gradient(circle at 15% 15%,rgba(255,255,255,0.4) 0%,rgba(255,255,255,0) 50%),linear-gradient(135deg,#22C55E 0%,#3B82F6 100%)}
.cbw-root[data-app-root="dark"] .cbw-head::after{content:"";position:absolute;top:-80%;left:-10%;width:40%;height:260%;background:linear-gradient(115deg,rgba(255,255,255,0.35) 0%,rgba(255,255,255,0) 60%);transform:rotate(20deg);pointer-events:none}
.cbw-logo{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,0.16);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cbw-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--bg);scroll-behavior:smooth}
.cbw-bubble-bot{align-self:flex-start;background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:13px;line-height:1.55;padding:10px 13px;border-radius:12px 12px 12px 4px;max-width:85%;white-space:pre-line;animation:cbwFadeIn .18s ease}
.cbw-bubble-user{align-self:flex-end;background:var(--accent);color:var(--accent-contrast);font-size:13px;line-height:1.55;padding:10px 13px;border-radius:12px 12px 4px 12px;max-width:85%;animation:cbwFadeIn .18s ease}
.cbw-typing{display:flex;gap:4px;align-items:center;padding:12px 14px}
.cbw-typing-dot{width:6px;height:6px;border-radius:50%;background:var(--text);opacity:0.45;animation:cbwBounce 1.1s infinite ease-in-out}
.cbw-typing-dot:nth-child(2){animation-delay:0.15s}
.cbw-typing-dot:nth-child(3){animation-delay:0.3s}
@keyframes cbwBounce{0%,60%,100%{transform:translateY(0);opacity:0.4}30%{transform:translateY(-4px);opacity:0.9}}
@keyframes cbwFadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@keyframes cbwPanelIn{from{opacity:0;transform:translateY(10px) scale(0.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.cbw-chip{background:var(--chip-bg);color:var(--accent);font-size:12px;font-weight:600;padding:7px 11px;border-radius:999px;border:none;cursor:pointer;text-align:left}
.cbw-chip:hover{background:var(--chip-hover)}
.cbw-inputrow{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border);flex-shrink:0;background:var(--surface)}
.cbw-input{flex:1;border:1px solid var(--border);border-radius:999px;padding:9px 14px;font-size:13px;outline:none;color:var(--text);background:var(--surface)}
.cbw-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(34,197,94,0.15)}
.cbw-send{width:36px;height:36px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;border:none;cursor:pointer}
.cbw-close{width:26px;height:26px;border-radius:7px;background:rgba(255,255,255,0.16);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;margin-left:auto}
.cbw-dot{position:absolute;bottom:1px;right:1px;width:15px;height:15px;border-radius:50%;background:#BBF7D0;border:2.5px solid #FFF;box-shadow:0 0 0 1px rgba(16,24,40,0.08)}
.cbw-dot-sm{position:absolute;bottom:-1px;right:-1px;width:9px;height:9px;border-radius:50%;background:#BBF7D0;border:2px solid #064E2E}
.cbw-close:hover{background:rgba(255,255,255,0.26)}
</style>
</helmet>

<div class="cbw-root" data-app-root="{{theme}}" style="color:var(--text)">

  <sc-if value="{{ closed }}">
    <button class="cbw-fab" onClick="{{ toggleOpen }}" aria-label="Open the MR.DRAFTORA chat" style="position:fixed">
      <svg width="26" height="26" viewBox="0 0 100 100" fill="none" aria-hidden="true">
        <path d="M 26.85,77.58 A 36,36 0 0 1 50,14" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="8" stroke-linecap="round" stroke-dasharray="9 12"/>
        <path d="M 50,14 A 36,36 0 0 1 73.15,77.58" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
        <circle cx="73.15" cy="77.58" r="13" fill="#BBF7D0"/>
      </svg>
      <span class="cbw-dot"></span>
    </button>
  </sc-if>

  <sc-if value="{{ !closed }}">
    <div class="cbw-panel">
      <div class="cbw-head">
        <div class="cbw-logo" style="position:relative">
          <svg width="18" height="18" viewBox="0 0 100 100" fill="none" aria-hidden="true">
            <path d="M 26.85,77.58 A 36,36 0 0 1 50,14" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="8" stroke-linecap="round" stroke-dasharray="9 12"/>
            <path d="M 50,14 A 36,36 0 0 1 73.15,77.58" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
            <circle cx="73.15" cy="77.58" r="13" fill="#BBF7D0"/>
          </svg>
          <span class="cbw-dot-sm"></span>
        </div>
        <div style="min-width:0">
          <div style="color:#FFF;font-weight:700;font-size:13.5px">MR.DRAFTORA</div>
          <div style="color:rgba(255,255,255,0.75);font-size:11px">CV Making Helper</div>
        </div>
        <div class="cbw-close" onClick="{{ toggleOpen }}" aria-label="Close chat">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="#FFF" stroke-width="2.2" stroke-linecap="round"/></svg>
        </div>
      </div>

      <div class="cbw-msgs">
        <sc-for list="{{messages}}" as="m" hint-placeholder-count="2">
          <sc-if value="{{ m.fromBot }}">
            <div class="cbw-bubble-bot">{{m.text}}</div>
          </sc-if>
          <sc-if value="{{ m.fromUser }}">
            <div class="cbw-bubble-user">{{m.text}}</div>
          </sc-if>
        </sc-for>

        <sc-if value="{{ typing }}">
          <div class="cbw-bubble-bot cbw-typing" aria-label="MR.DRAFTORA is typing">
            <span class="cbw-typing-dot"></span><span class="cbw-typing-dot"></span><span class="cbw-typing-dot"></span>
          </div>
        </sc-if>

        <sc-if value="{{ showChips }}">
          <div style="display:flex;flex-direction:column;gap:6px;margin-top:4px">
            <sc-for list="{{chips}}" as="chip" hint-placeholder-count="4">
              <button class="cbw-chip" onClick="{{ chip.ask }}">{{chip.label}}</button>
            </sc-for>
          </div>
        </sc-if>
      </div>

      <div class="cbw-inputrow">
        <input class="cbw-input" type="text" placeholder="Ask me what you need help with…" value="{{draft}}" onChange="{{ onDraft }}" onKeyDown="{{ onKeyDown }}">
        <button class="cbw-send" onClick="{{ send }}" aria-label="Send">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 11l18-7-7 18-3-7-8-4z" fill="#FFF"/></svg>
        </button>
      </div>
    </div>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"startOpen":{"editor":null},"$preview":{"width":140,"height":140}}'>
const CHIPS = [
  { label: "What does HR want in a CV today?" },
  { label: "How do I write a cover letter?" },
  { label: "What should my LinkedIn say?" },
  { label: "Which layout should I pick?" },
  { label: "What certifications do I need?" }
];

const KB = [
  { keys: ["main content", "what matters", "job market", "most important", "what to include", "what should i include", "stand out", "recruiters look for", "what employers want", "catches recruiter", "what counts", "what matters most"], answer: "In today's job market, four things matter most: 1) a tailored summary and skills list that mirror the exact keywords in the job post (most companies scan with ATS software first), 2) measurable achievements in your experience section — numbers, percentages, or outcomes beat vague duties, 3) relevant, up-to-date skills (tools, software, certifications) specific to the role, and 4) clean, consistent formatting that's easy to scan in under 10 seconds. Older, irrelevant history matters far less than a tight, targeted top half of the page." },
  { keys: ["ats", "applicant tracking", "keyword"], answer: "ATS systems scan for exact keywords from the job description, so mirror the wording the employer uses for your skills and job titles where it's accurate. Stick to standard section headings (Experience, Education, Skills), avoid text inside images or tables, and use a simple single- or two-column layout so the system can parse it correctly." },
  { keys: ["hr want", "hr wants", "hr looks for", "hr look for", "recruiter want", "recruiters want", "hiring manager", "what do employers", "what does hr"], answer: "HR teams today mainly screen for: 1) a resume tailored to THIS job, not a generic one, 2) proof of impact — specific results, not just duties, 3) skills that match the posting (tools, certifications, software), 4) a clean, error-free, easy-to-scan format, and 5) signs of adaptability and continuous learning. Many also check your LinkedIn or portfolio link, so make sure it matches your resume." },
  { keys: ["finance", "accounting", "accountant", "banking", "financial analyst", "finance certification"], answer: "For finance roles, HR looks for: certifications (CFA, CPA, CA, FRM if relevant), strong Excel/financial modeling skills, accuracy and compliance awareness, and quantified results — e.g. \"managed a $2M budget\" or \"reduced reporting errors by 20%\". Mention specific tools (Excel, SAP, QuickBooks, Bloomberg) and any regulatory knowledge relevant to your market." },
  { keys: ["marketing", "digital marketing", "seo", "social media manager", "brand", "marketing certification"], answer: "For marketing roles, lead with measurable campaign results — ROI, conversion rate, engagement growth, audience reach — rather than just \"managed social media.\" List the specific tools you use (Google Analytics, Meta Ads, HubSpot, SEO/SEM, Canva) and, if possible, link a portfolio of campaigns or content you've created. Useful certifications: Google Analytics, Google Ads, HubSpot Content/Inbound Marketing, Meta Blueprint." },
  { keys: ["it sector", "software engineer", "developer", "programmer", "technical role", "tech job", "coding", "information technology", "it industry", "it field", "technical", "it certification"], answer: "For IT/technical roles, HR and hiring managers want: the specific languages, frameworks, and tools you use (e.g. Python, React, AWS, Docker), measurable project impact (performance gains, users served, bugs reduced), and a link to GitHub or a portfolio. Mentioning Agile/Scrum experience helps. Useful certifications: AWS/Azure/Google Cloud, CompTIA, PMP or Scrum/Agile (CSM), and language- or vendor-specific certs relevant to your stack." },
  { keys: ["next 10 years", "future of job", "future skills", "future-proof", "long term career", "job market trend", "future certification"], answer: "Across every field, the skills that hold up over the next decade are: comfort working with AI and data tools, continuous learning (certifications, upskilling), strong communication and cross-functional collaboration, adaptability to new tools/processes, and proven problem-solving backed by measurable results. Helpful future-facing certifications: AI/ML fundamentals (Google, Microsoft, or Coursera/edX courses), data analytics (Google Data Analytics, Power BI), and project management (PMP, Scrum). Technical skills will keep changing, but these transferable strengths stay valuable." },
  { keys: ["certification", "certifications", "certificate", "qualification needed", "which course"], answer: "It depends on the field:\n• Finance — CFA, CPA, CA, or FRM, plus strong Excel/financial modeling.\n• Marketing — Google Analytics, Google Ads, HubSpot, or Meta Blueprint, backed by real campaign metrics (ROI, conversions, engagement).\n• IT/Technical — AWS/Azure/Google Cloud, CompTIA, or Scrum/Agile (CSM), plus a GitHub or project portfolio.\n• Future-proofing (any field) — AI/data literacy courses, data analytics certs, and project management (PMP/Scrum) for continuous learning.\nTell me which field you're in and I can go deeper." },
  { keys: ["layout", "template", "which one", "choose"], answer: "Pick a layout that matches your field: Classic suits most industries, Profile (with a photo) works well for client-facing or creative roles, and Sidebar is great when you have a lot of contact details or skills to show. Keep one layout throughout for consistency." },
  { keys: ["degree required", "degree needed", "which degree", "what degree", "educational qualification", "minimum qualification", "qualification required", "qualification needed", "eligibility criteria", "bachelors required", "bachelor's required", "masters required", "master's required", "postgraduate required", "education required", "degree do i need", "degree for"], answer: "Degree requirements vary by field and employer, but here's a general guide:\n\nUsually just a Bachelor's:\n• Software Engineer/Developer — B.Tech/B.E./BCA/BSc in CS or related (a strong portfolio can substitute)\n• Marketing, HR, Business roles — BBA/B.Com/BA in a related field\n• Accountant — B.Com/BBA in Accounting or Finance (CPA/CA helps for senior roles)\n• Graphic/UI Designer — BFA/B.Des, or a strong portfolio without one\n• Civil/Mechanical/Electrical Engineer — B.Tech/B.E. in that discipline\n• Nurse (RN) — BSN or ADN\n• Journalist — BA in Journalism/Communications\n• School Teacher — Bachelor's in Education or subject + teaching certification\n\nUsually need a Master's or professional degree:\n• Doctor/Physician — MBBS (or MD/DO), then residency\n• Lawyer — Bachelor's + JD (US) or LLB (most other countries)\n• University Professor/Researcher — PhD (Master's minimum for some teaching roles)\n• Clinical Psychologist — Master's or PhD in Psychology\n• Pharmacist — B.Pharm (India) or PharmD (US)\n• Architect — B.Arch (5-year bachelor's), M.Arch for some senior/academic roles\n• Senior management/strategy roles — MBA is common, though not always required\n• Data Scientist (research-heavy roles) — Master's/PhD in Stats, CS, or related; entry-level roles often accept a Bachelor's + a strong portfolio\n\nTell me the specific role you're targeting and I can be more precise." },
  { keys: ["skill", "skills"], answer: "List 6–10 skills that are directly relevant to the job you're applying for. Lead with the ones mentioned in the job post, and group similar skills together (e.g. tools vs. soft skills) so they're easy to scan." },
  { keys: ["experience", "bullet", "job history", "work history"], answer: "For each role, use 2–4 bullet points that start with an action verb and include a measurable result where possible (e.g. 'Reduced onboarding time by 30%'). Keep the most recent role the most detailed." },
  { keys: ["summary", "about me", "objective"], answer: "Keep your summary to 2–3 sentences: your role/years of experience, your strongest skill area, and what kind of impact you're looking to make next. Avoid generic phrases like 'hardworking team player'." },
  { keys: ["font", "typography", "typeface"], answer: "Stick to one clean, readable font family (like the Inter font used in these templates) and at most two weights — bold for headings, regular for body text. Avoid more than 2 font sizes in the body text." },
  { keys: ["color", "colour", "accent"], answer: "Pick one accent color and use it sparingly — for your name, section headings, or a sidebar. Keep the rest of the page neutral (black/gray/white) so the accent actually stands out and prints well." },
  { keys: ["photo", "picture", "headshot"], answer: "A photo is optional and more common outside the US — it fits the Profile layout well. If you include one, use a simple, well-lit headshot with a plain background." },
  { keys: ["pdf", "export", "download"], answer: "Once your resume looks right in the preview, use the Download PDF button at the top of the editor — it keeps your fonts and layout exactly as shown." },
  { keys: ["education"], answer: "List your highest or most relevant degree first, with the institution and year. You can drop older or less relevant education once you have a few years of work experience." },
  { keys: ["length", "one page", "pages"], answer: "Aim for one page if you have under ~10 years of experience, and no more than two pages otherwise. Trim older or less relevant roles rather than shrinking the font." },
  { keys: ["cover letter"], answer: "A strong cover letter is 3 short paragraphs: 1) the role you want and one sentence on why you're a fit, 2) one or two specific achievements that prove it (pull numbers straight from your resume), and 3) a brief close saying you're looking forward to discussing it further. Address a named person if you can find one, mirror 2-3 keywords from the job post, and keep the whole thing under half a page." },
  { keys: ["linkedin"], answer: "Your LinkedIn headline should state your role plus your strongest skill or specialty (not just a job title). The About section should expand on your resume summary in a more conversational tone, your Experience section can mirror your resume's bullet points, and you should list the same skills your resume uses as keywords. Add a professional photo and make sure your headline and most recent role match what's on your resume — recruiters check both." },
  { keys: ["reference", "references page", "recommendation letter"], answer: "Don't put \"References available upon request\" on your resume — it wastes space and is assumed. Instead, keep a separate one-page references list (name, title, company, relationship, phone/email) ready to send when asked, usually 2-3 people who can speak to your recent work." },
  { keys: ["portfolio", "work samples"], answer: "For design, writing, dev, or marketing roles, a portfolio link on your resume (next to your email) matters as much as the bullet points. Link to 3-5 of your strongest, most relevant pieces rather than everything you've made, and make sure each one loads fast and explains your specific role in it." },
  { keys: ["cv vs resume", "difference between cv and resume", "what is the difference"], answer: "In the US and Canada, a resume is a 1-2 page summary tailored per job, while a CV is longer and used mainly for academic, research, or medical roles, listing full publication and education history. In the UK, Europe, and most other countries, \"CV\" is just the common word for what Americans call a resume — same document, different name." }, 
  { keys: ["chronological", "functional resume", "combination resume", "resume format", "which format"], answer: "Chronological (most recent job first) is the safest default and what most recruiters expect. Functional (grouped by skill, not by job) can help hide gaps or a career change but is viewed with some suspicion by recruiters and ATS. Combination (a skills summary up top, then chronological history below) is a good middle ground if you're changing fields but still have relevant experience to show." },
  { keys: ["gap", "employment gap", "career break", "unemployed"], answer: "Don't try to hide a gap by omitting dates — it's noticeable and a red flag. A short line in your summary (e.g. \"took a career break for caregiving, returned to the workforce in 2024\") is usually enough; employers mainly want to know you're ready now. If you used the gap productively (courses, freelance work, volunteering), list it as a line item in your timeline." },
  { keys: ["career change", "switching careers", "changing industries", "transferable skills"], answer: "Lead with a summary that explicitly states the role you're targeting and your most relevant transferable skills (communication, project management, data analysis, etc. translate across most fields). Reorder your bullet points to foreground achievements closest to the new field, and consider the combination format above. A short line on why you're making the switch, framed positively, helps too." },
  { keys: ["fresher", "no experience", "student resume", "first job", "entry level", "intern"], answer: "With little or no work experience, lead with Education (GPA if strong, relevant coursework) and move it above Experience. Fill the Experience section with internships, class projects, part-time work, or volunteering — describe them with the same action-verb, measurable-impact style as a full job. A Skills section with the specific tools from the job post matters a lot here since you have less history to lean on." },
  { keys: ["executive resume", "senior role", "c-suite", "leadership resume"], answer: "Senior and executive resumes lead with a short leadership summary (scope: team size, budget, revenue you owned) rather than a list of duties. Favor business outcomes — revenue growth, cost savings, market expansion — over day-to-day tasks, and it's fine to run to two pages given the length of your track record. Board roles, speaking engagements, or publications can go in a short section near the end." },
  { keys: ["power verb", "strong verb", "verb list"], answer: "Strong resume verbs by type: Leadership — led, directed, launched, mentored. Growth — increased, grew, generated, expanded. Efficiency — streamlined, automated, reduced, optimized. Creation — built, designed, developed, founded. Avoid weak openers like \"responsible for\" or \"helped with\" — state what you actually did and its result instead." },
  { keys: ["mistake", "common mistakes", "what to avoid"], answer: "The most common resume mistakes: typos and inconsistent formatting (always proofread out loud), a generic \"one-size-fits-all\" resume sent to every job, listing duties instead of achievements, an unprofessional email address, missing or buried contact info, and resumes that are too long for the experience level. Fix the top three first — they cost the most interviews." },
  { keys: ["tailor", "customize resume", "tailoring", "every job"], answer: "Keep one master resume with everything you've done, then trim and reorder it per application: match 3-5 keywords from the job post into your summary and skills, reorder bullet points so the most relevant achievement for THIS role is first in each entry, and cut anything clearly irrelevant to the posting. Ten minutes of tailoring per application meaningfully raises your ATS match rate." },
  { keys: ["academic cv", "research cv", "phd", "publications"], answer: "Academic CVs run longer than a resume and are organized differently: Education first (with advisor/thesis topic), then Publications (full citation list), Grants & Fellowships, Teaching Experience, Conference Presentations, and Research Experience. Unlike a resume, length is expected — what matters is complete, accurately formatted citations." },
  { keys: ["freelance", "freelancer", "gig work", "self employed", "contract work"], answer: "List freelance/contract work the same way as a job: company name becomes \"Freelance [Your Role]\" or the client's name if notable, with the same action-verb, measurable-outcome bullet style. Group short-term or recurring clients under one \"Freelance Consultant\" entry with a date range rather than listing each gig separately, unless one project is especially impressive." },
  { keys: ["follow up", "follow-up email", "after applying", "after interview"], answer: "Send a short thank-you email within 24 hours of an interview, naming one specific thing you discussed and reaffirming your interest. If you haven't heard back after applying, one polite follow-up after 1-2 weeks is reasonable — keep it to two or three sentences and avoid following up more than once unless invited to." },
  { keys: ["dark mode", "light mode", "theme", "dark theme", "light theme"], answer: "You can switch between light and dark mode any time using the toggle in the top-right of the page (the sun/moon icon) — your choice is remembered the next time you visit." }
];

function scrollMsgsToBottom() {
  setTimeout(() => {
    try {
      const el = document.querySelector(".cbw-msgs");
      if (el) el.scrollTop = el.scrollHeight;
    } catch (e) {}
  }, 30);
}

const GREETING = "Hi! I'm MR.DRAFTORA, your CV specialist. Here's what I can help with:\n• Resume design and writing (layout, fonts, wording, formats)\n• Cover letters, LinkedIn profiles, references, and portfolios\n• What HR and recruiters look for today, by industry\n• Career changes, employment gaps, freshers, and executive resumes\n• Rating your CV's content quality and what to add right now\nPick a question below, or just type what you need help with.";

function isRatingRequest(raw) {
  const text = raw.toLowerCase();
  const RATING_PHRASES = [
    "rate my cv", "rate my resume", "rate this cv", "rate this resume",
    "how good is my cv", "how good is my resume", "how strong is my cv",
    "how strong is my resume", "score my cv", "score my resume",
    "quality of my cv", "quality of my resume", "grade my cv", "grade my resume",
    "review my cv", "review my resume", "how is my cv", "how is my resume",
    "rate the content", "content quality rating", "rate content"
  ];
  return RATING_PHRASES.some((p) => text.includes(p));
}

function isAcknowledgement(raw) {
  const text = raw.toLowerCase().trim().replace(/[.!]+$/, "");
  const ACK_PHRASES = [
    "ok", "okay", "k", "kk", "alright", "all right", "got it", "gotit",
    "understood", "cool", "sounds good", "great", "nice", "perfect",
    "thanks", "thank you", "thx", "ty", "appreciate it", "noted", "fine", "good"
  ];
  return ACK_PHRASES.includes(text);
}

function matchAnswer(raw) {
  const text = raw.toLowerCase();
  let best = null;
  let bestScore = 0;
  for (const entry of KB) {
    let score = 0;
    for (const k of entry.keys) {
      if (text.includes(k)) score += k.split(" ").length;
    }
    if (score > bestScore) {
      bestScore = score;
      best = entry;
    }
  }
  if (best) return best.answer;
  const IN_SCOPE_WORDS = [
    "resume", "cv", "curriculum", "template", "design", "pdf", "export",
    "professional", "cover letter", "job application", "interview", "work history",
    "job title", "portfolio", "formatting", "format",
    "margin", "spacing", "bullet", "action verb", "ats", "applicant tracking",
    "keyword", "achievement", "certification", "reference", "print", "paper",
    "hiring", "recruiter", "job post", "career", "qualification",
    "layout", "icon", "alignment", "contrast", "theme", "dark", "light",
    "linkedin", "gap", "fresher", "entry level", "intern", "chronological",
    "functional", "executive", "freelance", "follow up", "follow-up", "mistake",
    "tailor", "academic", "publication", "thesis", "grant",
    "degree", "bachelor", "master", "postgraduate", "eligibility"
  ];
  const inScope = IN_SCOPE_WORDS.some((k) => text.includes(k));
  if (inScope) {
    return "Good question — here's the short version: keep it simple, consistent, and focused on one clear message or skill set at a time. Try asking me about layout, colors, fonts, or skills for more specific tips.";
  }
  return "I'm built just to help you make your resume more professional — I can't help with anything outside of resume/CV writing. Try asking about layout, wording, colors, fonts, or skills.";
}

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      closed: !(props && props.startOpen),
      draft: "",
      typing: false,
      messages: [
        { fromBot: true, fromUser: false, text: GREETING }
      ]
    };
  }

  pushAndAnswer(question) {
    const trimmed = question.trim();
    if (!trimmed || this.state.typing) return;
    const withUser = [...this.state.messages, { fromBot: false, fromUser: true, text: trimmed }];
    this.setState({ draft: "", typing: true, messages: withUser });
    scrollMsgsToBottom();
    const delay = 420 + Math.random() * 380;
    setTimeout(() => {
      const answer = isRatingRequest(trimmed)
        ? this.rateCvQuality()
        : isAcknowledgement(trimmed)
        ? "You're welcome! If you need anything else, just let me know."
        : matchAnswer(trimmed);
      this.setState({
        typing: false,
        messages: [...withUser, { fromBot: true, fromUser: false, text: answer }]
      });
      scrollMsgsToBottom();
    }, delay);
  }

  rateCvQuality() {
    const raw = (this.props && this.props.cvScore) || "";
    if (!raw) {
      return "I can rate your CV's content quality once you're actively working on it in the Resume Builder editor — open a resume there and ask me again.";
    }
    let data = null;
    try { data = JSON.parse(raw); } catch (e) {}
    if (!data) {
      return "I can rate your CV's content quality once you're actively working on it in the Resume Builder editor — open a resume there and ask me again.";
    }
    const completion = data.completion || 0;
    const quality = data.quality || 0;
    const qualityLabel = data.qualityLabel || "";
    const categories = data.categories || [];
    const sorted = [...categories].sort((a, b) => b.quality - a.quality);
    const strongest = sorted[0];
    const weakest = sorted[sorted.length - 1];

    let msg = `Here's my read on your CV's content quality right now:\n\n`;
    msg += `• Completion: ${completion}%\n`;
    msg += `• Content quality: ${quality}% (${qualityLabel})`;
    if (strongest) msg += `\n• Strongest section: ${strongest.name} (${strongest.quality}%)`;
    if (weakest && (!strongest || weakest.name !== strongest.name)) {
      msg += `\n• Needs the most work: ${weakest.name} (${weakest.quality}%)`;
    }
    msg += "\n\n";
    if (quality >= 85) {
      msg += "Overall this reads excellent — specific, quantified, and well-organized. Minor polish at most from here.";
    } else if (quality >= 70) {
      msg += "Overall this is good, solid content. Tightening your weakest section above with more specific wording or numbers would push it into excellent territory.";
    } else if (quality >= 50) {
      msg += "There's a decent foundation here, but it still reads generic in places — focus on your weakest section first and add measurable outcomes wherever you can.";
    } else {
      msg += "This needs real work before it's ready to send — start with your weakest section above, add specific numbers and outcomes, and avoid vague duty statements.";
    }

    const rawTips = (this.props && this.props.cvTips) || "";
    const tips = rawTips.split(" || ").map((t) => t.trim()).filter(Boolean);
    if (tips.length > 0) {
      msg += "\n\nSuggestions to improve it:\n" + tips.map((t, i) => `${i + 1}. ${t}`).join("\n");
    } else {
      msg += "\n\nNo specific fixes needed right now — every section is already reading well.";
    }
    return msg;
  }

  askCvTips() {
    if (this.state.typing) return;
    const raw = (this.props && this.props.cvTips) || "";
    const tips = raw.split(" || ").map((t) => t.trim()).filter(Boolean);
    let answer;
    if (tips.length === 0) {
      answer = "Nice — based on what you've filled in so far, your CV looks complete and solid. Keep descriptions specific and back them up with numbers as you add more.";
    } else {
      answer = "Here's what I'd add or fix right now, based on your CV as it stands:\n" + tips.map((t, i) => `${i + 1}. ${t}`).join("\n");
    }
    const withUser = [...this.state.messages, { fromBot: false, fromUser: true, text: "What should I add to my CV right now?" }];
    this.setState({ typing: true, messages: withUser });
    scrollMsgsToBottom();
    setTimeout(() => {
      this.setState({ typing: false, messages: [...withUser, { fromBot: true, fromUser: false, text: answer }] });
      scrollMsgsToBottom();
    }, 480);
  }

  renderVals() {
    const hasCvContext = this.props && typeof this.props.cvTips !== "undefined";
    const baseChips = CHIPS.map((c) => ({
      label: c.label,
      ask: () => this.pushAndAnswer(c.label)
    }));
    const chips = hasCvContext
      ? [
          { label: "Rate my CV's content quality", ask: () => this.pushAndAnswer("Rate my CV's content quality") },
          { label: "What should I add to my CV right now?", ask: () => this.askCvTips() },
          ...baseChips
        ]
      : baseChips;

    return {
      theme: (this.props && this.props.theme) || "light",
      closed: this.state.closed,
      messages: this.state.messages,
      draft: this.state.draft,
      typing: !!this.state.typing,
      showChips: this.state.messages.length <= 1 && !this.state.typing,
      chips,
      toggleOpen: () => {
        const isClosingNow = !this.state.closed;
        if (isClosingNow) {
          this.setState({
            closed: true,
            draft: "",
            typing: false,
            messages: [{ fromBot: true, fromUser: false, text: GREETING }]
          });
        } else {
          this.setState({ closed: false });
          setTimeout(() => {
            try {
              const el = document.querySelector(".cbw-input");
              if (el) el.focus();
            } catch (e) {}
          }, 60);
        }
      },
      onDraft: (e) => this.setState({ draft: e.target.value }),
      onKeyDown: (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          this.pushAndAnswer(this.state.draft);
        }
      },
      send: () => this.pushAndAnswer(this.state.draft)
    };
  }
}
</script>
